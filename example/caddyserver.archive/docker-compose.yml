services:
  caddy:
    image: caddy:latest
    container_name: caddyserver
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/caddyfile:/etc/caddy/Caddyfile
      - ./caddy/srv:/srv
      - ./caddy/data:/data
      - ./caddy/config:/config